<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #191919; --ink: #F0D9E4; --accent: #C1A0AC; --muted: #806C79; --edge: #4A3F4B; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #383836; } /* matches the Notion gray panel it sits in */
  body { display: grid; place-items: center; }
  svg { width: min(92vw, 92vh); height: auto; }
  .tick { stroke: var(--muted); stroke-linecap: round; }
  .tick.major { stroke: var(--ink); }
  .hand { stroke-linecap: round; }
  text { font-family: "Cormorant Garamond", Georgia, serif; fill: var(--ink); text-anchor: middle; font-variant-numeric: lining-nums tabular-nums; }
</style>
</head>
<body>
<svg viewBox="0 0 200 200" aria-label="Analog clock">
  <circle cx="100" cy="100" r="96" fill="none" stroke="var(--edge)" stroke-width="1"/>
  <g id="ticks"></g>
  <text id="time" x="100" y="128" font-size="17" font-weight="600"></text>
  <text id="date" x="100" y="144" font-size="11" style="fill: var(--accent)"></text>
  <line id="h" class="hand" x1="100" y1="100" x2="100" y2="58" stroke="var(--ink)" stroke-width="3.2"/>
  <line id="m" class="hand" x1="100" y1="100" x2="100" y2="34" stroke="var(--ink)" stroke-width="2"/>
  <line id="s" class="hand" x1="100" y1="112" x2="100" y2="26" stroke="var(--accent)" stroke-width="1"/>
  <circle cx="100" cy="100" r="3" fill="var(--accent)"/>
</svg>
<script>
  const ticks = document.getElementById("ticks");
  for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0, a = i * 6 * Math.PI / 180;
    const r1 = major ? 80 : 86, r2 = 90;
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", 100 + r1 * Math.sin(a)); l.setAttribute("y1", 100 - r1 * Math.cos(a));
    l.setAttribute("x2", 100 + r2 * Math.sin(a)); l.setAttribute("y2", 100 - r2 * Math.cos(a));
    l.setAttribute("class", "tick" + (major ? " major" : ""));
    l.setAttribute("stroke-width", major ? 2 : 0.8);
    ticks.appendChild(l);
  }
  const rot = (id, deg) => document.getElementById(id).setAttribute("transform", `rotate(${deg} 100 100)`);
  function tick() {
    const d = new Date(), s = d.getSeconds(), m = d.getMinutes(), h = d.getHours() % 12;
    rot("s", s * 6); rot("m", m * 6 + s * 0.1); rot("h", h * 30 + m * 0.5);
    document.getElementById("time").textContent = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", second: "2-digit" });
    document.getElementById("date").textContent = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
