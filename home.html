<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Header</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>/* Home palette: Chinese Black #0C1519, Dark Jungle Green #162127, Jet #3A3534, Coffee #724B39, Antique Brass #CF9D7B.
   --muted and --ink are tints of Antique Brass so text stays legible on the dark greens. */
:root{--a:#0C1519;--b:#162127;--jet:#3A3534;--accent:#724B39;--glow:#CF9D7B;--muted:#B98A6C;--ink:#F3E6DC}
* { box-sizing: border-box; margin: 0; }
html, body { background: #191919; }
body { font-family: "EB Garamond", Georgia, serif; color: var(--ink); padding: 0; }
.card {
  border-radius: 6px; padding: 20px 24px 16px;
  background: radial-gradient(ellipse at 88% 0%, color-mix(in srgb, var(--glow) 22%, transparent), transparent 55%),
              linear-gradient(135deg, var(--a) 0%, var(--b) 60%, var(--jet) 100%);
  box-shadow: none;
}
.inner { border: 1px solid color-mix(in srgb, var(--glow) 45%, transparent); padding: 16px 20px 14px; }
.top { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: flex-end; }
.eyebrow { font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: var(--glow); }
h1 { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 500;
     font-size: 50px; line-height: 1; margin: 6px 0 4px; }
h1.sm { font-size: 34px; font-style: normal; font-weight: 600; }
.sub { color: color-mix(in srgb, var(--ink) 75%, transparent); font-size: 16px; }
.sub b { color: var(--glow); font-weight: 500; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { min-width: 112px; padding: 9px 13px; background: color-mix(in srgb, var(--a) 60%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent); border-top: 3px solid var(--glow); }
.stat .n { font-family: "Cormorant Garamond", serif; font-size: 32px; font-weight: 600; line-height: 1; }
.stat .l { font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
           color: color-mix(in srgb, var(--ink) 70%, transparent); margin-top: 4px; }
.rule { height: 1px; margin: 14px 0 12px;
        background: linear-gradient(90deg, transparent, var(--accent), var(--glow), var(--accent), transparent); }
.courses { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.course { padding: 10px 13px; background: color-mix(in srgb, var(--b) 70%, transparent); border-left: 4px solid var(--c, var(--glow)); }
.code { font-size: 11px; letter-spacing: .2em; color: var(--c, var(--glow)); }
.name { font-family: "Cormorant Garamond", serif; font-size: 21px; font-weight: 600; margin: 2px 0 3px; }
.meta { font-size: 13px; color: color-mix(in srgb, var(--ink) 72%, transparent); }
.bar { height: 5px; background: color-mix(in srgb, var(--ink) 14%, transparent); margin-top: 7px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--c, var(--glow))); }
.note { font-size: 11px; color: color-mix(in srgb, var(--ink) 55%, transparent); margin-top: 8px; letter-spacing: .04em; }
.palette { display: flex; margin-top: 12px; height: 8px; }
.palette span { flex: 1; }
@media (max-width: 560px) { h1 { font-size: 38px; } .card { padding: 12px; } .inner { padding: 12px; } }
</style></head>
<body>
<style>
.timeline { position: relative; margin-top: 4px; }
.segs { display: flex; gap: 2px; height: 22px; }
.seg { flex: 1; display: flex; align-items: center; justify-content: center; opacity: .9; }
.seg span { font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: #0C1519; font-weight: 500; }
.row { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
.lab { width: 44px; font-size: 11px; letter-spacing: .14em; color: var(--muted); }
.track { position: relative; flex: 1; height: 8px; background: color-mix(in srgb, var(--ink) 10%, transparent); }
.span { position: absolute; top: 0; bottom: 0; border-radius: 1px; }
.now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--glow); box-shadow: 0 0 6px var(--glow); }
.big { height: 9px; background: color-mix(in srgb, var(--ink) 12%, transparent); margin-top: 6px; }
.big i { display: block; height: 100%; background: linear-gradient(90deg, var(--muted), var(--glow)); }
</style>
<div class="card"><div class="inner">
  <div class="top">
    <div>
      <div class="eyebrow">WGU · Catalog 202609 · <span id="now"></span></div>
      <h1>B.S. IT Management</h1>
      <div class="sub">Term 1 · Oct 1, 2026 – Mar 31, 2027 · <b id="month"></b></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n"><span id="cu"></span><small style="font-size:16px"> / 112</small></div><div class="l">CUs earned</div></div>
      <div class="stat"><div class="n" id="term">–</div><div class="l">Days left in term</div></div>
    </div>
  </div>
  <div class="big"><i id="cubar"></i></div>
  <div class="rule"></div>
  <div class="timeline" id="tl">
    <div class="segs"><div class="seg" style="background:#E36D2F" title="October"><span>Oct</span></div><div class="seg" style="background:#C7895C" title="November"><span>Nov</span></div><div class="seg" style="background:#C9474D" title="December"><span>Dec</span></div><div class="seg" style="background:#B3D5F1" title="January"><span>Jan</span></div><div class="seg" style="background:#E7AEBB" title="February"><span>Feb</span></div><div class="seg" style="background:#D7CBB2" title="March"><span>Mar</span></div></div>
    <div class="row"><div class="lab">C715</div><div class="track"><div class="span" style="background:#E36D2F" data-a="2026-10-01" data-b="2026-11-15"></div></div></div><div class="row"><div class="lab">C483</div><div class="track"><div class="span" style="background:#E36D2F" data-a="2026-10-02" data-b="2027-02-01"></div></div></div><div class="row"><div class="lab">E091</div><div class="track"><div class="span" style="background:#C7895C" data-a="2026-11-15" data-b="2026-12-31"></div></div></div><div class="row"><div class="lab">D370</div><div class="track"><div class="span" style="background:#E7AEBB" data-a="2027-02-01" data-b="2027-03-31"></div></div></div>
  </div>
  <div class="palette"><span style="background:#0C1519"></span><span style="background:#162127"></span><span style="background:#3A3534"></span><span style="background:#724B39"></span><span style="background:#CF9D7B"></span></div>
</div></div>
<script>
const DAY = 864e5;
const today = new Date(); today.setHours(0, 0, 0, 0);
const D = (s) => new Date(s + "T00:00:00");
const daysTo = (s) => Math.round((D(s) - today) / DAY);
const pct = (a, b) => Math.min(100, Math.max(0, (today - D(a)) / (D(b) - D(a)) * 100));
const fmt = (s) => D(s).toLocaleDateString("en-US", { month: "short", day: "numeric" });
const $ = (id) => document.getElementById(id);

// Updated by the daily sync: CUs earned so far (27 transfer CUs + passed courses).
const CU_EARNED = 27, CU_TOTAL = 112;
const TS = "2026-10-01", TE = "2027-03-31";
$("cu").textContent = CU_EARNED; $("cubar").style.width = (CU_EARNED / CU_TOTAL * 100) + "%";
$("term").textContent = Math.max(0, daysTo(TE));
$("now").textContent = today.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
$("month").textContent = "Now: " + today.toLocaleDateString("en-US", { month: "long" });
const span = D(TE) - D(TS) + DAY;
const pos = (s) => Math.min(100, Math.max(0, (D(s) - D(TS)) / span * 100));
document.querySelectorAll(".span").forEach(el => {
  const a = pos(el.dataset.a), b = pos(el.dataset.b) + DAY / span * 100;
  el.style.left = a + "%"; el.style.width = (b - a) + "%";
});
document.querySelectorAll(".track").forEach(tr => {
  const n = document.createElement("div"); n.className = "now";
  n.style.left = Math.min(100, Math.max(0, (today - D(TS)) / span * 100)) + "%"; tr.appendChild(n);
});
</script>
</body></html>
